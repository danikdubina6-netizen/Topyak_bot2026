name: 5-Hour Runner Lifecycle

on:
  schedule:
    # Запуск каждые 5 часов (в 0:00, 5:00, 10:00, 15:00, 20:00 UTC)
    # Настрой cron под своё время, если нужно сместить
    - cron: '0 */5 * * *'
  workflow_dispatch: # Возможность запустить вручную в любой момент

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Задаем жесткий лимит времени, например, чуть меньше 5 часов (например, 4 часа 50 минут),
    # чтобы GitHub сам принудительно не оборвал воркер в самый неудобный момент.
    timeout-minutes: 290 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Установи свои зависимости, если они нужны
          # pip install -r requirements.txt

      - name: Run Bot / Script
        env:
          # Сюда передавай свои токены через GitHub Secrets
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "Раннер запущен и работает..."
          # Твой скрипт бота или приложения
          python main.py
          
