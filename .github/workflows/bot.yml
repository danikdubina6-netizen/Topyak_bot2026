name: Telegram Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Запуск каждые 5 часов, чтобы GitHub не успевал принудительно гасить раннер
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pyTelegramBotAPI requests; fi

    - name: Run bot
      env:
        TOKEN: ${{ secrets.TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_NAME: ${{ secrets.REPO_NAME }}
      run: |
        python main.py
        
