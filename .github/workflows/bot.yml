name: Topyak Bot Runner

on:
  push:
    branches: [ "main" ]
  schedule:
    # Запускается каждые 4 часа, чтобы обновлять сессию до лимита в 5 часов
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: self-hosted
    # Жесткий лимит в 240 минут (4 часа), после чего GitHub сам мягко завершит задачу
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir pyTelegramBotAPI

      - name: Run Bot Script
        run: |
          python main.py
          
