name: Telegram Bot Runner

on:
  push:
    branches: [ main ]
  schedule:
    # Запуск каждые 5 часов, чтобы GitHub не успевал принудительно гасить раннер
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyTelegramBotAPI

    - name: Run bot
      env:
        TOKEN: ${{ secrets.TOKEN }}
      run: |
        python main.py
        
