5-Hour Runner Lifecycle

on:
  schedule:
    - cron: '0 */5 * * *' # Запуск каждые 5 часов
  workflow_dispatch:      # Добавляет заветную кнопку ручного запуска в приложении/на сайте GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Самый главный шаг: скачивает самую свежую версию твоего main.py из репозитория

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytelegrambotapi

      - name: Run bot
