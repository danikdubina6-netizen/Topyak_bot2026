name: Telegram Bot Runner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Перезапуск каждые 5 часов, чтобы бот не тух
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI

      - name: Run Telegram Bot
        # Принудительно завершает процесс через 300 минут (5 часов), 
        # чтобы старый раннер не зависал навсегда.
        timeout-minutes: 300
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          python main.py
          
